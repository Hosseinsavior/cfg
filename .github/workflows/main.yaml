name: "Collect IPs"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 6'   # هر شنبه ۰۰:۰۰ UTC
  # push:
  #   branches: [ "main" ]   # فقط برای تست دستی باز کن، نه در حالت عادی

permissions:
  contents: write

concurrency:
  group: collect-ips
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dnspython>=2.6,<3"

      - name: Collect IPs
        run: python collect.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain list.json list.txt)" ]]; then
            echo "تغییری وجود ندارد؛ commit انجام نمی‌شود."
            exit 0
          fi

          git add list.json list.txt
          git commit -m "chore: automatic IP update [skip ci]"
          git push
